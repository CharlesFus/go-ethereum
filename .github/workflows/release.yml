name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # ---------------------------------------------------------------------------
  # Linux builds (amd64 + arm64 only)
  # ---------------------------------------------------------------------------
  build-linux:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - arch: amd64
            cc: ""
          - arch: arm64
            cc: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - name: Install cross-compilers (arm64)
        if: matrix.arch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -yq --no-install-suggests --no-install-recommends \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          sudo ln -sf /usr/include/asm-generic /usr/include/asm

      - name: Build
        run: |
          cc_flag=""
          arch_flag=""
          if [ -n "${{ matrix.cc }}" ]; then
            cc_flag="-cc ${{ matrix.cc }}"
          fi
          if [ "${{ matrix.arch }}" != "amd64" ]; then
            arch_flag="-arch ${{ matrix.arch }}"
          fi
          go run build/ci.go install -dlgo $arch_flag $cc_flag

      - name: Create archive
        run: |
          arch_flag=""
          if [ "${{ matrix.arch }}" != "amd64" ]; then
            arch_flag="-arch ${{ matrix.arch }}"
          fi
          go run build/ci.go archive $arch_flag -type tar

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: geth-*.tar.gz

  # ---------------------------------------------------------------------------
  # Windows build (amd64 only)
  # ---------------------------------------------------------------------------
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - name: Install MinGW gcc
        shell: cmd
        run: C:\msys64\usr\bin\pacman.exe -S --noconfirm mingw-w64-x86_64-gcc

      - name: Build
        shell: cmd
        run: |
          set PATH=C:\msys64\mingw64\bin;%PATH%
          C:\msys64\mingw64\bin\gcc.exe --version
          go run build/ci.go install -dlgo -arch amd64 -cc C:\msys64\mingw64\bin\gcc.exe

      - name: Create archive
        shell: cmd
        run: |
          set PATH=C:\msys64\mingw64\bin;%PATH%
          go run build/ci.go archive -arch amd64 -type zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: geth-*.zip

  # ---------------------------------------------------------------------------
  # Docker multi-arch image
  # ---------------------------------------------------------------------------
  build-docker:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lowercase image name
        id: lower
        run: echo "image=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.lower.outputs.image }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=raw,value=stable

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            commit=${{ github.sha }}
            version=${{ github.ref_name }}
          build-args: |
            COMMIT=${{ github.sha }}
            VERSION=${{ github.ref_name }}
            BUILDNUM=${{ github.run_number }}

  # ---------------------------------------------------------------------------
  # Create GitHub Release draft
  # ---------------------------------------------------------------------------
  release:
    needs: [build-linux, build-windows, build-docker]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lhR dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

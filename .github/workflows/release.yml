name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # ---------------------------------------------------------------------------
  # Linux builds (amd64 + arm64)
  # ---------------------------------------------------------------------------
  build-linux:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - arch: amd64
            cc: ""
          - arch: arm64
            cc: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - name: Install cross-compilers (arm64)
        if: matrix.arch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -yq --no-install-suggests --no-install-recommends \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          sudo ln -sf /usr/include/asm-generic /usr/include/asm

      - name: Build
        run: |
          CC_FLAG=""
          ARCH_FLAG=""
          if [ -n "${{ matrix.cc }}" ]; then
            CC_FLAG="-cc ${{ matrix.cc }}"
          fi
          if [ "${{ matrix.arch }}" != "amd64" ]; then
            ARCH_FLAG="-arch ${{ matrix.arch }}"
          fi
          go run build/ci.go install -dlgo -git-tag "${{ github.ref_name }}" $ARCH_FLAG $CC_FLAG

      - name: Create archive
        run: |
          ARCH_FLAG=""
          if [ "${{ matrix.arch }}" != "amd64" ]; then
            ARCH_FLAG="-arch ${{ matrix.arch }}"
          fi
          go run build/ci.go archive -git-tag "${{ github.ref_name }}" $ARCH_FLAG -type tar

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: geth-*.tar.gz

  # ---------------------------------------------------------------------------
  # Windows build (amd64)
  # ---------------------------------------------------------------------------
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - name: Install MinGW gcc
        shell: cmd
        run: C:\msys64\usr\bin\pacman.exe -S --noconfirm mingw-w64-x86_64-gcc

      - name: Build
        shell: cmd
        run: |
          set PATH=C:\msys64\mingw64\bin;%PATH%
          C:\msys64\mingw64\bin\gcc.exe --version
          go run build/ci.go install -dlgo -git-tag %GITHUB_REF_NAME% -arch amd64 -cc C:\msys64\mingw64\bin\gcc.exe

      - name: Create archive
        shell: cmd
        run: |
          set PATH=C:\msys64\mingw64\bin;%PATH%
          go run build/ci.go archive -git-tag %GITHUB_REF_NAME% -arch amd64 -type zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: geth-*.zip

  # ---------------------------------------------------------------------------
  # Docker multi-arch image
  # ---------------------------------------------------------------------------
  build-docker:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lowercase image name
        id: lower
        run: echo "image=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.lower.outputs.image }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=raw,value=stable

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: false
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            commit=${{ github.sha }}
            version=${{ github.ref_name }}
          build-args: |
            COMMIT=${{ github.sha }}
            VERSION=${{ github.ref_name }}
            BUILDNUM=${{ github.run_number }}

  # ---------------------------------------------------------------------------
  # Create GitHub Release draft
  # ---------------------------------------------------------------------------
  release:
    needs: [build-linux, build-windows, build-docker]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: linux-*
          merge-multiple: true

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: windows-*
          merge-multiple: true

      - name: Generate release notes
        env:
          TAG: ${{ github.ref_name }}
          IMAGE: ghcr.io/${{ github.repository }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          IMAGE_LOWER=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=${SHA::8}

          # Generate SHA256 checksums
          cd dist
          sha256sum * > SHA256SUMS.txt
          cd ..

          # Build release body
          {
            echo "## What's Changed"
            echo ""
            echo "Security-patched release based on go-ethereum v1.15.10, with backported fixes for critical denial-of-service vulnerabilities."
            echo ""
            echo "## Docker"
            echo ""
            echo '```bash'
            echo "docker pull ${IMAGE_LOWER}:${TAG}"
            echo '```'
            echo ""
            echo "Available tags: \`${TAG}\`, \`stable\`, \`latest\`"
            echo ""
            echo "## Downloads"
            echo ""
            echo "| File | SHA256 |"
            echo "|------|--------|"
          } > release_body.md

          cd dist
          for f in $(ls -1 *.tar.gz *.zip 2>/dev/null | sort); do
            hash=$(sha256sum "$f" | cut -d' ' -f1)
            echo "| \`${f}\` | \`${hash:0:16}…\` |" >> ../release_body.md
          done
          cd ..

          {
            echo ""
            echo "Full checksums available in \`SHA256SUMS.txt\` attached below."
            echo ""
            echo "## Build Info"
            echo ""
            echo "- **Base**: go-ethereum v1.15.10"
            echo "- **Go**: 1.24.2 (via \`-dlgo\`)"
            echo "- **Commit**: [\`${SHORT_SHA}\`](https://github.com/${REPO}/commit/${SHA})"
          } >> release_body.md

          echo "--- Generated release_body.md ---"
          cat release_body.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: release_body.md
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

